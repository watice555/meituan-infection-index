<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7b733" />
    <meta
      name="description"
      content="选择城市、病种和日期范围，查看并导出美团指数历史数据。"
    />
    <meta property="og:title" content="美团指数存档" />
    <meta
      property="og:description"
      content="选择城市、病种和日期范围，查看并导出美团指数历史数据。"
    />
    <meta property="og:type" content="website" />
    <title>美团指数存档</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-heading">
        <h1>美团指数存档</h1>
        <p>选择城市、病种和日期范围，查看并导出美团指数历史数据。</p>
      </header>

      <section class="query-panel" aria-label="查询条件">
        <label>
          <span>城市</span>
          <select id="city-select" aria-label="选择城市"></select>
        </label>
        <label>
          <span>病种</span>
          <select id="disease-select" aria-label="选择病种"></select>
        </label>
        <fieldset class="range-control">
          <legend>时间范围</legend>
          <div id="range-options" class="range-options">
            <button type="button" data-range="14" aria-pressed="true">14 天</button>
            <button type="button" data-range="30" aria-pressed="false">30 天</button>
            <button type="button" data-range="90" aria-pressed="false">90 天</button>
            <button type="button" data-range="all" aria-pressed="false">全部</button>
          </div>
        </fieldset>
        <label>
          <span>起始日期</span>
          <input id="start-date" type="date" aria-label="选择自定义起始日期" />
        </label>
        <label>
          <span>结束日期</span>
          <input id="end-date" type="date" aria-label="选择自定义结束日期" />
        </label>
      </section>

      <section id="status" class="status" role="status" hidden></section>

      <section id="dashboard" class="dashboard" hidden>
        <article class="chart-card">
          <h2>趋势图</h2>
          <div class="chart-wrap">
            <canvas id="trend-chart" role="img" aria-label="指数趋势折线图"></canvas>
            <div id="chart-tooltip" class="chart-tooltip" hidden></div>
          </div>
        </article>

        <article class="table-card">
          <div class="table-heading">
            <h2>列表数据</h2>
            <button id="download-csv" class="download-button" type="button">导出 CSV</button>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">日期</th>
                  <th scope="col">城市</th>
                  <th scope="col">病种</th>
                  <th scope="col" class="numeric">指数值</th>
                </tr>
              </thead>
              <tbody id="data-table"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
