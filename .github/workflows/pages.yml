name: 更新并发布指数

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 准备 Pages
        uses: actions/configure-pages@v5

      - name: 恢复已发布历史
        env:
          HISTORY_URL: https://watice555.github.io/meituan-infection-index/data/indexes.json
        run: |
          mkdir -p data
          status="$(curl --retry 3 --retry-all-errors --silent --show-error --output "${RUNNER_TEMP}/history.json" --write-out '%{http_code}' "${HISTORY_URL}" || true)"
          case "${status}" in
            200) echo "已恢复上一版公开历史" ;;
            404) rm -f "${RUNNER_TEMP}/history.json"; echo "首次发布，无历史数据" ;;
            *) echo "恢复历史失败（HTTP ${status}），停止本次发布" >&2; exit 1 ;;
          esac

      - name: 保持定时工作流活跃
        if: github.event_name == 'schedule'
        run: |
          last_commit="$(git log -1 --format=%ct)"
          age_days="$(( ($(date +%s) - last_commit) / 86400 ))"
          if (( age_days >= 30 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled index refresh active"
            git push origin HEAD:main
          else
            echo "最近一次仓库活动距今 ${age_days} 天，无需保活提交"
          fi

      - name: 抓取并合并五城指数
        env:
          MEITUAN_DJ_TOKEN: ${{ secrets.MEITUAN_DJ_TOKEN }}
        run: |
          args=(--output data/indexes.json)
          if [[ -f "${RUNNER_TEMP}/history.json" ]]; then
            args+=(--history "${RUNNER_TEMP}/history.json")
          fi
          python3 scripts/fetch_data.py "${args[@]}"

      - name: 运行离线校验
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/fetch_data.py
          node --check app.js

      - name: 上传 Pages 文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
